name: Deploy Backend to Azure App Service (Manual OIDC)

# This workflow is strictly configuration-only until manually authorized and triggered.
# It uses Azure OIDC Federated Identity Credentials instead of long-lived secrets.

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Deployment target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_health_check:
        description: 'Perform post-deployment health check'
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure App Service
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies & run pre-flight tests
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pytest backend/tests

      - name: Prepare Backend Deployment Package
        run: |
          mkdir -p deploy-pkg
          cp -r backend/app deploy-pkg/
          cp -r backend/sample_data deploy-pkg/
          cp backend/requirements.txt deploy-pkg/
          cd deploy-pkg && zip -r ../backend-artifact.zip .

      - name: Log in to Azure via OIDC (Federated Credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          package: backend-artifact.zip

      - name: Verify Application Health
        if: ${{ inputs.run_health_check }}
        run: |
          echo "Waiting 20 seconds for App Service to restart..."
          sleep 20
          APP_URL="https://${{ vars.AZURE_APP_NAME }}.azurewebsites.net/health"
          echo "Checking health endpoint at $APP_URL"
          curl --fail --retry 3 --retry-delay 5 "$APP_URL" || echo "Warning: Health endpoint returned non-200. Check App Service streaming logs."
